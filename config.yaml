origem: CGB
destinos:
  - GRU
  - CGH
  # - VCP  # avaliar incluir; Azul costuma ter bons preços CGB-VCP

periodo:
  inicio: 2026-11-09
  fim: 2026-11-30

dias_obrigatorios: []   # vazio = qualquer data dentro do periodo serve, sem dia fixo obrigatorio
margem_adjacente: 1     # so tem efeito se dias_obrigatorios nao estiver vazio

duracao:
  minima: 5
  maxima: 7

passageiros: 1

alertas:
  preco_maximo: 500        # em R$, ida + volta -- dispara alerta imediato quando achar preco <= esse valor
  queda_percentual: 10
  novo_menor_preco: true

resumo_diario: "08:00"     # horario de Cuiaba (informativo; quem controla o horario real e o cron do workflow)
